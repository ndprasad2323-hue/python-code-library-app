---
services:
  db:
     image: ndprasad23/python23:db
     ports:
     - "3306:3306"
     volums:
     - mydata:/var/lib/mysql/
     networks:
     - mynetwork
  auth_services:
     image: ndprasad23/python23:auth
     ports:
     - "5001:5001"
     networks:
     - mynetwork
  book_services:
    image: ndprasad23/python23:book
     ports:
     - "5002:5002"
     networks:
     - mynetwork
  barrow_services:
     image: ndprasad23/python23:barrow
     ports:
     - "5003:5003"
     networks:
     - mynetwork
  forntend:
     image: ndprasad23/python23:frontend
     ports:
     - "5000:5000"
     networks:
     - mynetwork

networks:
  mynetwork:
    driver: overlay

volumes:
  mydata:
