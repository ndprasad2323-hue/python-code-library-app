---
services:
  db:
    image: ndprasad23/python23:db
    container_name: db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      myapp:
        aliases:
          - db

  auth_service:
    image: ndprasad23/python23:auth
    container_name: auth_container
    ports:
      - "5001:5001"
    networks:
      myapp:
        aliases:
          - auth_service

  book_service:
    image: ndprasad23/python23:book
    container_name: book_container
    ports:
      - "5002:5002"
    networks:
      myapp:
        aliases:
          - book_service

  borrow_service:
    image: ndprasad23/python23:borrow
    container_name: borrow_container
    ports:
      - "5003:5003"
    networks:
      myapp:
        aliases:
          - borrow_service

  frontend:
    image: ndprasad23/python23:frontend
    container_name: frontend_container
    ports:
      - "5000:5000"
    networks:
      myapp:
        aliases:
          - frontend

networks:
  myapp:
    driver: overlay

volumes:
  mydata:
