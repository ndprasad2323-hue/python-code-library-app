---
services:
  db:
    image: ndprasad23/python23:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    image: ndprasad23/python23:auth
    ports:
      - "6001:6001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  book_service:
    image: ndprasad23/python23:book
    ports:
      - "6002:6002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  borrow_service:
    image: ndprasad23/python23:borrow
    ports:
      - "6003:6003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  frontend:
    image: ndprasad23/python23:frontend
    ports:
      - "6000:6000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
networks:
  myapp:
    driver: overlay
volumes:
  mydata:
