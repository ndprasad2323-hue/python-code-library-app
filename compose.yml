---
services:
  db:
    image: ndprasad23/python23:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: ndprasad23/python23:auth
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: ndprasad23/python23:book
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: ndprasad23/python23:borrow
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: ndprasad23/python23:frontend
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    

networks:
  mynetwork:
    driver: overlay
