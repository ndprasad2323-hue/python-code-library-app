---
services:
  db:
    container_name: db
    image: ndprasad23/python23:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp

  auth_service:
    container_name: auth_service
    image: ndprasad23/python23:auth
    ports:
      - "5001:5001"
    networks:
      - myapp
  book_service:
    container_name: book_service
    image: ndprasad23/python23:book
    ports:
      - "5002:5002"
    networks:
      - myapp
  borrow_service:
    container_name: borrow_service
    image: ndprasad23/python23:borrow
    ports:
      - "5003:5003"
    networks:
      - myapp
  frontend:
    container_name: frontend
    image: ndprasad23/python23:frontend
    ports:
      - "5000:5000"
    networks:
      - myapp
networks:
  myapp:
    driver: overlay
volumes:
  mydata:
