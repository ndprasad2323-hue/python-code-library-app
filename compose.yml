---
services:
  db:
    container_name: db
    image: ndprasad23/python23:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    container_name: auth_service
    image: ndprasad23/python23:auth
    ports:
      - "5001:5001"
    networks:
       - mynetwork

  book_service:
    container_name: book_service
    image: ndprasad23/python23:book
    ports:
      - "5002:5002"
    networks:
      - mynetwork

  borrow_service:
    container_name: borrow_service
    image: ndprasad23/python23:borrow
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    
  frontend:
    container_name: frontend
    image: ndprasad23/python23:frontend
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    
networks:
  mynetwork:
    driver: overlay
